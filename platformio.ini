[env:pro_micro_nrf52840]
platform = https://github.com/LeeorNahum/platform-n-able-pro-micro-nrf52840.git#master
board = pro_micro_nrf52840
framework = arduino
extra_scripts = post:copy_uf2.py

; เปลี่ยน Node ID ที่นี่จุดเดียว (1–254) แล้วสั่ง pio run
custom_node_id = 115


; เลือก radio ที่นี่จุดเดียว:
;   USE_SX1262 = RA-01SH / HT-RA62 (SX1262, มี DIO1 + BUSY)
;   USE_RFM95  = RFM95 / SX1276 (มี DIO0, ไม่มี BUSY)
custom_radio = USE_SX1262

; 0 = CPU ทำงานปกติ
; 1 = System-ON idle, LoRa RX และ OLED ยังเปิด
custom_low_power = 1

; ⚠️ Apple Silicon: n-able pin toolchain arm-none-eabi เป็น x86_64 (GCC 9.3.1) → "Bad CPU type" ถ้าไม่มี Rosetta
; override ใช้ toolchain arm64-native ที่ติดตั้งอยู่แล้ว (GCC 12) — ไม่ต้องแตะระบบ · แก้เดียวกับ FireWild_DePIN/firmware/node_nrf52840
platform_packages =
  platformio/toolchain-gccarmnoneeabi@1.120301.0

build_flags =
  -DNODE_ID=${this.custom_node_id}
  -D${this.custom_radio}
  -DLOW_POWER_IDLE=${this.custom_low_power}
  -DVARIANT_MCK=64000000ul
  -DUSE_TINYUSB
  -DUSBCON
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

lib_deps =
  Adafruit SSD1306
  Adafruit BME280 Library
  Adafruit Unified Sensor
  h2zero/NimBLE-Arduino


; =====================================================================
; [MEAS] build สำหรับแคมเปญวัด propagation (เล่ม Sensors)
;   ต่างจาก build ปกติ 3 อย่าง — ดู include/meas.h
;     1. อ่าน SNR + SignalRSSI จาก GetPacketStatus (ของเดิมอ่านมาแล้วทิ้ง)
;     2. log ทุก TX และทุก RX เป็น CSV ออก serial (รวมเฟรมที่หายและ CRC เสีย)
;     3. **ปิด adaptive TX power** (7->17 dBm ตาม RSSI) ซึ่งทำให้ RSSI-vs-distance
;        เป็นลูปป้อนกลับ ไม่ใช่ path loss ล้วน
;   build ปกติด้านบนไม่เปลี่ยนพฤติกรรมเลย
; =====================================================================
[env:pro_micro_nrf52840_meas]
extends = env:pro_micro_nrf52840
build_flags =
  ${env:pro_micro_nrf52840.build_flags}
  -DFW_MEAS_MODE
